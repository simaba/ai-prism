name: Link Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CURATION.md'
      - 'REVIEW_STATUS.md'
      - '.lycheeignore'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 8 1 * *'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in Markdown files
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --format markdown
            --output lychee-report.md
            --max-concurrency 2
            --retry-wait-time 5
            --max-retries 3
            --timeout 30
            --accept 200,204,206,301,302,307,308,403,429
            --exclude-mail
            --exclude '^https://img\.shields\.io/'
            --exclude-file .lycheeignore
            README.md CURATION.md REVIEW_STATUS.md
          fail: true

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: ignore

      - name: Fail on unresolved link errors
        if: steps.lychee.outcome == 'failure'
        run: exit 1
