name: Link Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CURATION.md'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 8 1 * *'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 2
            --retry-wait-time 5
            --max-retries 3
            --timeout 30
            --accept 200,204,206,301,302,307,308,403,429
            --exclude-mail
            --exclude '^https://img\.shields\.io/'
            README.md CURATION.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
