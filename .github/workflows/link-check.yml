name: Link Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CURATION.md'
      - 'REVIEW_STATUS.md'
      - '.lycheeignore'
      - 'scripts/check_links.py'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create verified link report
        id: diagnostic
        continue-on-error: true
        run: >-
          python scripts/check_links.py
          README.md CURATION.md REVIEW_STATUS.md
          --report link-report.json

      - name: Upload verified link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
          if-no-files-found: error

      - name: Run secondary link check
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 2
            --retry-wait-time 5
            --max-retries 3
            --timeout 30
            --accept 200,204,206,301,302,307,308,403,429
            --exclude-mail
            --exclude '^https://img\.shields\.io/'
            --exclude-file .lycheeignore
            README.md CURATION.md REVIEW_STATUS.md
          fail: true

      - name: Fail on verified unresolved links
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1
